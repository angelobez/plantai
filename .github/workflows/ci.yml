name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed folders
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        name: Compare against the base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE...$PR_HEAD"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          if ! files=$(git diff --name-only "$range" 2>/dev/null); then
            # Unknown base (e.g. the first push of a branch): run everything.
            echo "Could not diff $range; running both parts"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$files"
          # A change to the workflow itself runs both parts.
          workflow=false
          if echo "$files" | grep -q '^\.github/workflows/'; then workflow=true; fi
          api=$workflow
          app=$workflow
          if echo "$files" | grep -q '^api/'; then api=true; fi
          if echo "$files" | grep -q '^app/'; then app=true; fi
          echo "api=$api app=$app"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Testcontainers starts PostGIS on the runner's Docker.
      - run: npm test

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  # The only required check on `main`. It always runs, so a docs-only PR is not
  # left waiting for a job the folder filter skipped. The deploy job is left
  # out of its `needs`: it runs only after a merge, never in a PR's gate.
  ci:
    name: ci
    needs: [changes, api, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job that ran failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended as '$result'"; exit 1 ;;
            esac
          done

  # Publishes the API after a merge to `main` that changed it, once the API
  # job passed on the same commit. The `production` environment admits only
  # `main` and holds AWS_DEPLOY_ROLE_ARN (variable), MIGRATION_DATABASE_URL
  # and ALERT_EMAIL (secrets); the runbook of #92 sets it up. AWS trusts the
  # environment's OIDC subject (api/infra/github-deploy-role.ts), so no AWS
  # key is stored in GitHub.
  deploy:
    name: Deploy API
    needs: [changes, api]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://api.plantai.ia.br/v1/health
    permissions:
      id-token: write
      contents: read
    # One deploy at a time, in order: a new one waits instead of cancelling
    # the one running (migrations and CloudFormation must not overlap).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # Before the new code: the new function never runs on an old schema. A
      # failed migration stops the job here, and the function keeps running
      # the code it had. Neon's direct connection, not the pooler.
      - name: Apply the database migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: npm run db:migrate
      # Packages the Lambda, checks the concurrency quota and deploys the
      # stack. The CDK CLI assumes the bootstrap roles to publish the assets
      # and run CloudFormation. ALERT_EMAIL is a secret, so it is masked in
      # the log.
      - name: Deploy the stack
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: npm run cdk:deploy -- --require-approval never
      # Through the domain: the Function URL answers 403 without CloudFront's
      # origin header. Retries for about two minutes while the new version
      # warms up.
      - name: Check the API on its domain
        env:
          HEALTH_URL: https://api.plantai.ia.br/v1/health
        run: |
          for attempt in $(seq 1 12); do
            status=$(curl --silent --output health.json --write-out '%{http_code}' \
              --max-time 15 "$HEALTH_URL" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = 200 ]; then break; fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          if [ "$status" != 200 ]; then
            echo "::error::GET $HEALTH_URL answered $status instead of 200"
            cat health.json 2>/dev/null || true
            exit 1
          fi
          cat health.json
      # The API version is the one the deployed API reports (`apiVersion` of
      # the health answer, from api/package.json); the commit pins the code.
      - name: Write the deploy summary
        env:
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          api_version=$(jq -r .apiVersion health.json)
          postgis_version=$(jq -r .postgisVersion health.json)
          {
            echo "## API deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | [\`${SHA:0:7}\`]($SERVER_URL/$REPOSITORY/commit/$SHA) |"
            echo "| API version | \`$api_version\` |"
            echo "| PostGIS | \`$postgis_version\` |"
            echo "| URL | https://api.plantai.ia.br |"
          } >> "$GITHUB_STEP_SUMMARY"
