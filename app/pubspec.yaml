name: plantai
description: "PlantAí: identify plants by photo, get care tips and give away seedlings to neighbors."
publish_to: 'none'

# Sent as X-App-Version; the API answers 426 below its MIN_APP_VERSION.
version: 0.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  go_router: ^18.1.1
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.2
  provider: ^6.1.5+1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  # Static instances of Manrope from Google Fonts (OFL, see
  # assets/fonts/OFL.txt), bundled so nothing is downloaded at run time.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
