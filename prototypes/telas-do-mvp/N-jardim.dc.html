<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A3 · Meu jardim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A7320}a:hover{color:#365517}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Source Sans 3', sans-serif; color: #2B2B2B; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="background: {{leaf}}; padding: 50px 16px 0; color: #FFFFFF">
    <h1 style="margin: 0; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">Meu jardim</h1>
  </header>
  <div style="padding: 12px 16px; font-size: 14px; color: #595959; border-bottom: 1px solid #E2E2E2">6 plantas</div>

  <main style="flex: 1; padding: 2px 2px 90px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; align-content: start">
    <sc-for list="{{plants}}" as="p" hint-placeholder-count="6">
      <a href="N-especie.dc.html" style="display: flex; flex-direction: column; text-decoration: none; color: inherit">
        <div style="aspect-ratio: 1 / 1; background: {{p.bg}}; display: flex; align-items: center; justify-content: center; color: #6E8F48">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
        </div>
        <div style="padding: 6px 6px 10px; display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 700; color: #4A7320; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
          <span style="font-size: 12px; font-style: italic; color: #595959; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.sci}}</span>
        </div>
      </a>
    </sc-for>
  </main>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #F7F7F7; border-top: 1px solid #E2E2E2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-top: 8px; box-sizing: border-box">
    <a href="#" aria-current="page" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: #4A7320; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
      Meu jardim
    </a>
    <a href="#" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #595959; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Identificar
    </a>
    <a href="N-perto.dc.html" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #595959; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Por perto
    </a>
    <a href="#" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #595959; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
      Perfil
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"leaf":{"editor":"color","default":"#557E25","options":["#557E25","#2F7D4F","#3E6E5A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
leaf: this.props.leaf ?? '#557E25',
plants: [
{ name: 'Monstera da sala', sci: 'Monstera deliciosa', bg: '#DDE8CC' },
{ name: 'Jiboia', sci: 'Epipremnum aureum', bg: '#D3E2C0' },
{ name: 'Espada da varanda', sci: 'Dracaena trifasciata', bg: '#E4ECD6' },
{ name: 'Babosa', sci: 'Aloe vera', bg: '#D3E2C0' },
{ name: 'Lírio-da-paz', sci: 'Spathiphyllum wallisii', bg: '#E4ECD6' },
{ name: 'Pimenta da vó', sci: 'sem espécie', bg: '#DDE8CC' }
]
};
}
}
</script>
