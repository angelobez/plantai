  <header style="height: 56px; padding: 0 16px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; border-bottom: 1px solid #EDF2EE">

    <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.25">Como os vizinhos falam com você e de onde você doa</h1>

    <section style="display: flex; flex-direction: column; gap: 8px">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/></svg>
        Testar no WhatsApp

          Localização encontrada pelo GPS
        </div>
        <label for="bairro" style="font-size: 13px; font-weight: 700">Bairro</label>
        <input id="bairro" type="text" value="Vila Mariana" style="height: 48px; padding: 0 14px; border: 1.5px solid #D3DED6; border-radius: 12px; font-size: 16px; color: #1F2A22; background: #FFFFFF">
      </div>
      <p style="margin: 0; display: flex; gap: 8px; font-size: 13px; line-height: 1.45; color: #5B665E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3F6B4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
