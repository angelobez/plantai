<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Busca no Catálogo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F6B4A}a:hover{color:#2E5237}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Manrope', sans-serif; color: #1F2A22; display: flex; flex-direction: column; padding-top: 24px; overflow: hidden">
  <header style="padding: 6px 16px 12px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #EDF2EE">
    <a href="M-foto.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: #EEF4EF; color: #1F2A22; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex: 1; height: 46px; padding: 0 14px; border-radius: 14px; background: #EEF4EF; display: flex; align-items: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B665E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar espécie pelo nome</label>
      <input id="q" type="search" value="banana de macaco" style="flex: 1; min-width: 0; border: none; background: transparent; font-size: 16px; color: #1F2A22; outline: none">
    </div>
  </header>
  <h1 style="margin: 14px 20px 4px; font-size: 13px; font-weight: 700; color: #5B665E">2 espécies no Catálogo</h1>

  <main style="padding: 0 4px; display: flex; flex-direction: column">
    <sc-for list="{{results}}" as="r" hint-placeholder-count="2">
      <a href="M-especie.dc.html" style="display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #EDF2EE; text-decoration: none; color: inherit">
        <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 14px; background: {{r.tint}}; display: flex; align-items: center; justify-content: center; color: #3F6B4A">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">{{r.name}}</span>
          <span style="font-size: 13px; font-style: italic; color: #5B665E">{{r.sci}}</span>
          <span style="font-size: 12px; font-weight: 600; color: #3F6B4A">{{r.also}}</span>
        </div>
      </a>
    </sc-for>
  </main>

  <div style="margin: 20px; padding: 16px; border-radius: 16px; background: #F5F8F5; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 700">Não achou?</span>
    <span style="font-size: 13px; line-height: 1.45; color: #5B665E">Você pode salvar só com o nome que digitou. Sem espécie, a planta fica sem dicas de cuidado, mas dá para definir depois.</span>
    <a href="M-planta.dc.html" style="min-height: 46px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #3F6B4A; color: #3F6B4A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; text-decoration: none">Salvar só com o nome “banana de macaco”</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
results: [
{ name: 'Costela-de-adão', sci: 'Monstera deliciosa', also: 'também chamada de banana-de-macaco', tint: '#C9DECD' },
{ name: 'Filodendro-ondulado', sci: 'Thaumatophyllum bipinnatifidum', also: 'também chamada de banana-de-macaco', tint: '#DCE9DF' }
]
};
}
}
</script>
</body>
</html>
