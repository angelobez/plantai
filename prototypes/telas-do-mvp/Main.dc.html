<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A · Mudas por perto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B45}a:hover{color:#15523A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7F2; font-family: 'Nunito', sans-serif; color: #17231B; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px">Mudas por perto</h1>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: {{primary}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
        PlantAí
      </span>
    </div>
    <div role="tablist" style="display: flex; background: #E3EBE0; border-radius: 999px; padding: 4px; gap: 4px">
      <button role="tab" aria-selected="true" style="flex: 1; height: 44px; border: none; border-radius: 999px; background: #FFFFFF; color: #17231B; font-size: 15px; font-weight: 800; box-shadow: 0 1px 3px rgba(23,35,27,0.12)">Por perto</button>
      <button role="tab" aria-selected="false" style="flex: 1; height: 44px; border: none; border-radius: 999px; background: transparent; color: #4A5C50; font-size: 15px; font-weight: 700">Meus anúncios</button>
    </div>
    <p style="margin: 0; font-size: 14px; color: #4A5C50">Anúncios a até 30 km, do mais perto ao mais longe</p>
  </header>

  <main style="flex: 1; padding: 4px 20px 120px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
      <a href="#" style="display: flex; gap: 14px; padding: 12px; background: #FFFFFF; border-radius: 20px; text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(23,35,27,0.06)">
        <div style="width: 88px; height: 88px; flex-shrink: 0; border-radius: 14px; background: #DCEFD9; display: flex; align-items: center; justify-content: center; color: #3C8A5E">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center">
          <div style="font-size: 17px; font-weight: 800">{{item.name}}</div>
          <div style="font-size: 14px; color: #4A5C50">{{item.qty}}</div>
          <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: {{primary}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
            {{item.dist}} · {{item.bairro}}
          </div>
        </div>
      </a>
    </sc-for>
  </main>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: #FFFFFF; border-top: 1px solid #E3EBE0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; padding-top: 8px">
    <a href="A-jardim.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: #4A5C50; text-decoration: none; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
      Meu jardim
    </a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; color: {{primary}}; text-decoration: none; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Por perto
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: #4A5C50; text-decoration: none; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
      Perfil
    </a>
  </nav>
  <a href="#" aria-label="Identificar uma planta pela foto" style="position: absolute; right: 20px; bottom: 104px; width: 64px; height: 64px; border-radius: 22px; background: {{primary}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(31,107,69,0.35)">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#1F6B45","options":["#1F6B45","#2E6E8E","#7A4E9C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
primary: this.props.primary ?? '#1F6B45',
items: [
{ name: 'Costela-de-adão', qty: '3 mudas', dist: 'menos de 1 km', bairro: 'Vila Mariana' },
{ name: 'Espada-de-são-jorge', qty: '5 mudas', dist: 'a cerca de 2 km', bairro: 'Saúde' },
{ name: 'Jiboia', qty: '2 mudas', dist: 'a cerca de 4 km', bairro: 'Ipiranga' },
{ name: 'Babosa', qty: '8 mudas', dist: 'a cerca de 7 km', bairro: 'Mooca' }
]
};
}
}
</script>
</body>
</html>
