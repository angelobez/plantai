<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>C · Meu jardim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#444444}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; color: #111111; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="padding: 52px 20px 18px; display: flex; align-items: flex-end; justify-content: space-between">
    <h1 style="margin: 0; font-size: 46px; font-weight: 800; line-height: 0.95; letter-spacing: -1.5px">Meu<br>jardim</h1>
    <span style="font-size: 15px; font-weight: 800; padding: 6px 12px; border: 2px solid #111111; border-radius: 999px; background: {{sun}}">4 plantas</span>
  </header>

  <main style="flex: 1; padding: 0 20px 160px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{plants}}" as="p" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; border: 2px solid #111111; border-radius: 14px">
        <div style="width: 72px; height: 72px; border-radius: 10px; background: #E8F5E0; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
        </div>
        <a href="C-especie.dc.html" style="display: flex; flex-direction: column; gap: 2px; min-width: 0; text-decoration: none">
          <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.3px">{{p.name}}</span>
          <span style="font-size: 14px">{{p.species}}</span>
        </a>
        <a href="#" style="min-height: 44px; padding: 0 12px; border: 2px solid #111111; border-radius: 10px; display: flex; align-items: center; font-size: 13px; font-weight: 800; text-decoration: none">Doar</a>
      </div>
    </sc-for>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 2px solid #111111; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 10px">
    <a href="#" style="height: 52px; border: 2px solid #111111; border-radius: 12px; background: {{sun}}; box-shadow: 4px 4px 0 #111111; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Fotografar uma planta
    </a>
    <nav aria-label="Navegação principal" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <a href="#" aria-current="page" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px">Meu jardim</a>
      <a href="C-perto.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none">Por perto</a>
      <a href="#" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none">Perfil</a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sun":{"editor":"color","default":"#FFD23F","options":["#FFD23F","#9BE3B0","#FFB38A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
sun: this.props.sun ?? '#FFD23F',
plants: [
{ name: 'Monstera da sala', species: 'Costela-de-adão' },
{ name: 'Jiboia', species: 'Jiboia' },
{ name: 'Espada da varanda', species: 'Espada-de-são-jorge' },
{ name: 'Pimenta da vó', species: 'Sem espécie' }
]
};
}
}
</script>
</body>
</html>
