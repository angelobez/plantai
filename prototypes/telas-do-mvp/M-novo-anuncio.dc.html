<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Novo anúncio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F6B4A}a:hover{color:#2E5237}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Manrope', sans-serif; color: #1F2A22; display: flex; flex-direction: column; padding-top: 24px; overflow: hidden">
  <header style="height: 56px; padding: 0 16px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; border-bottom: 1px solid #EDF2EE">
    <a href="M-planta.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 999px; background: #EEF4EF; color: #1F2A22; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; font-weight: 800">Doar mudas</h1>
    <span></span>
  </header>

  <main style="flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; gap: 14px; align-items: center">
      <div style="width: 96px; height: 96px; flex-shrink: 0; border-radius: 16px; background: #7FA886"></div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; color: #5B665E">Foto da planta do seu jardim</span>
        <a href="#" style="align-self: flex-start; min-height: 40px; padding: 0 14px; border-radius: 999px; background: #EEF4EF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; text-decoration: none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          Tirar foto da muda
        </a>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nome" style="font-size: 14px; font-weight: 700">Nome popular</label>
      <input id="nome" type="text" value="Costela-de-adão" style="height: 50px; padding: 0 14px; border: 1.5px solid #D3DED6; border-radius: 14px; font-size: 16px; color: #1F2A22">
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 46px; border-bottom: 1px solid #EDF2EE">
      <span style="font-size: 14px; font-weight: 700">Espécie</span>
      <span style="font-size: 14px; font-style: italic; color: #5B665E">Monstera deliciosa</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <span id="qtd-label" style="font-size: 14px; font-weight: 700">Quantidade de mudas</span>
      <div role="group" aria-labelledby="qtd-label" style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: #EEF4EF">
        <button aria-label="Menos uma" style="width: 40px; height: 40px; border: none; border-radius: 999px; background: #FFFFFF; color: #1F2A22; font-size: 20px; font-weight: 700">−</button>
        <span style="min-width: 36px; text-align: center; font-size: 17px; font-weight: 800">3</span>
        <button aria-label="Mais uma" style="width: 40px; height: 40px; border: none; border-radius: 999px; background: #3F6B4A; color: #FFFFFF; font-size: 20px; font-weight: 700">+</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="obs" style="font-size: 14px; font-weight: 700">Observação <span style="font-weight: 500; color: #5B665E">(opcional)</span></label>
      <textarea id="obs" rows="3" style="padding: 12px 14px; border: 1.5px solid #D3DED6; border-radius: 14px; font-size: 15px; line-height: 1.45; color: #1F2A22; resize: none">Mudas já enraizadas na água, prontas para ir para o vaso.</textarea>
      <span style="align-self: flex-end; font-size: 12px; color: #5B665E">57/200</span>
    </div>
  </main>

  <div style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #EDF2EE">
    <a href="M-meus-anuncios.dc.html" style="height: 54px; border-radius: 999px; background: #3F6B4A; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Publicar anúncio</a>
    <span style="font-size: 12px; color: #5B665E; text-align: center">Fica visível por 30 dias para quem está a até 30 km.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
