<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A2 · Meu jardim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17824A}a:hover{color:#0F6538}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{mint}}; font-family: 'Inter', sans-serif; color: #0E3B24; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="margin: 48px 14px 0; flex: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 8px 30px rgba(14,59,36,0.08); display: flex; flex-direction: column; overflow: hidden">
    <header style="padding: 18px 18px 14px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center">
      <span></span>
      <h1 style="margin: 0; text-align: center; font-size: 16px; font-weight: 700">Meu jardim</h1>
      <span style="font-size: 12px; color: #4C6657; text-align: right">4 plantas</span>
    </header>

    <main style="flex: 1; padding: 6px 18px 0 28px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <sc-for list="{{plants}}" as="p" hint-placeholder-count="4">
        <a href="G-especie.dc.html" style="display: flex; gap: 14px; align-items: center; padding: 10px 12px 10px 0; background: {{mint}}; border-radius: 14px; text-decoration: none; color: inherit">
          <div style="width: 84px; height: 84px; flex-shrink: 0; margin-left: -10px; border-radius: 14px; background: #BFE3CB; box-shadow: 0 6px 14px rgba(14,59,36,0.15); display: flex; align-items: center; justify-content: center; color: #17824A">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="font-size: 15px; font-weight: 700">{{p.name}}</div>
            <div style="font-size: 12px; color: #4C6657">{{p.species}}</div>
            <div style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #4C6657; margin-top: 4px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#17824A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>
              <span>{{p.water}}</span>
            </div>
          </div>
        </a>
      </sc-for>
    </main>

    <div style="padding: 14px 18px 8px">
      <a href="#" style="height: 52px; border-radius: 14px; background: #17824A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; text-decoration: none; box-shadow: 0 8px 18px rgba(23,130,74,0.3)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Adicionar uma planta
      </a>
    </div>
    <nav aria-label="Navegação principal" style="height: 72px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; border-top: 1px solid #E4EFE8">
      <a href="#" aria-current="page" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: #17824A; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
        Meu jardim
      </a>
      <a href="G-perto.dc.html" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: #4C6657; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Por perto
      </a>
      <a href="#" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: #4C6657; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
        Perfil
      </a>
    </nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mint":{"editor":"color","default":"#EAF6EE","options":["#EAF6EE","#F1F7E9","#E8F3F3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
mint: this.props.mint ?? '#EAF6EE',
plants: [
{ name: 'Monstera da sala', species: 'Costela-de-adão', water: 'Rega 1x por semana' },
{ name: 'Jiboia', species: 'Jiboia', water: 'Rega 1x por semana' },
{ name: 'Espada da varanda', species: 'Espada-de-são-jorge', water: 'Rega a cada 15 dias' },
{ name: 'Pimenta da vó', species: 'Sem espécie', water: 'Sem dicas: defina a espécie' }
]
};
}
}
</script>
</body>
</html>
