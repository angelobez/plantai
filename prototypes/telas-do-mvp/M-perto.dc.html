<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Manrope', sans-serif; color: #1F2A22; display: flex; flex-direction: column; overflow: hidden">

    <p style="margin: 6px 18px 4px; font-size: 13px; color: #5B665E">Doações de vizinhos a até 30 km</p>

    <main style="flex: 1; padding: 0 4px; display: flex; flex-direction: column; overflow: hidden">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
        <a href="M-anuncio.dc.html" style="display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-bottom: 1px solid #EDF2EE; text-decoration: none; color: inherit">
          <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 14px; background: #E3EEE5; display: flex; align-items: center; justify-content: center; color: #5E8C66">

          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 16px; font-weight: 700">{{item.name}}</div>
            <div style="font-size: 13px; color: #5B665E">{{item.sci}} · {{item.qty}}</div>
            <div style="font-size: 13px; font-weight: 600; color: #3F6B4A">{{item.dist}} · {{item.bairro}}</div>
          </div>
        </a>
      </sc-for>
    </main>

    <nav aria-label="Navegação principal" style="height: 80px; flex-shrink: 0; border-top: 1px solid #EDF2EE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; padding-top: 10px; box-sizing: border-box">
      <a href="M-jardim.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: #5B665E; text-decoration: none; min-height: 44px">

        Jardim

      <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; color: #3F6B4A; text-decoration: none; min-height: 44px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Por perto
      </a>
      <a href="M-perfil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: #5B665E; text-decoration: none; min-height: 44px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
        Perfil
      </a>
      <a href="M-foto.dc.html" aria-label="Identificar uma planta pela foto" style="justify-self: center; width: 52px; height: 52px; border-radius: 16px; background: #3F6B4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -4px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </a>
    </nav>
  </div>
</div>
