<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Candidatos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F6B4A}a:hover{color:#2E5237}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Manrope', sans-serif; color: #1F2A22; display: flex; flex-direction: column; padding-top: 24px; overflow: hidden">
  <header style="height: 56px; padding: 0 16px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; border-bottom: 1px solid #EDF2EE">
    <a href="M-foto.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 999px; background: #EEF4EF; color: #1F2A22; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; font-weight: 800">Qual destas é a sua?</h1>
    <span></span>
  </header>

  <div style="padding: 14px 20px 6px; display: flex; gap: 12px; align-items: center">
    <div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 12px; background: #7FA886"></div>
    <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #5B665E">Compare a sua foto com as fotos de cada sugestão e escolha a que for igual.</p>
  </div>

  <main style="flex: 1; padding: 8px 20px 0; display: flex; flex-direction: column; overflow: hidden">
    <sc-for list="{{cands}}" as="c" hint-placeholder-count="3">
      <a href="M-especie.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: 1px solid #EDF2EE; text-decoration: none; color: inherit">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <div style="height: 86px; border-radius: 12px; background: {{c.t1}}"></div>
          <div style="height: 86px; border-radius: 12px; background: {{c.t2}}"></div>
          <div style="height: 86px; border-radius: 12px; background: {{c.t1}}"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 16px; font-weight: 700">{{c.name}}</span>
            <span style="font-size: 13px; font-style: italic; color: #5B665E">{{c.sci}}</span>
          </div>
          <span style="height: 40px; padding: 0 16px; border-radius: 999px; background: #EEF4EF; color: #3F6B4A; display: flex; align-items: center; font-size: 14px; font-weight: 700">É esta</span>
        </div>
      </a>
    </sc-for>
  </main>

  <div style="padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #EDF2EE">
    <a href="M-busca.dc.html" style="height: 50px; border-radius: 999px; border: 1.5px solid #D3DED6; color: #1F2A22; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-decoration: none">Nenhuma destas</a>
    <span style="font-size: 11px; color: #5B665E; text-align: center">Identificação: Pl@ntNet · fotos de referência dos autores no Pl@ntNet</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
cands: [
{ name: 'Costela-de-adão', sci: 'Monstera deliciosa', t1: '#9EBFA4', t2: '#7FA886' },
{ name: 'Filodendro-ondulado', sci: 'Thaumatophyllum bipinnatifidum', t1: '#B3CDB7', t2: '#94B79A' },
{ name: 'Monstera-adansonii', sci: 'Monstera adansonii', t1: '#A7C5AC', t2: '#86AE8D' }
]
};
}
}
</script>
</body>
</html>
