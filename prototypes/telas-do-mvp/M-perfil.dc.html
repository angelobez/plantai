<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Perfil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F6B4A}a:hover{color:#2E5237}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Manrope', sans-serif; color: #1F2A22; display: flex; flex-direction: column; padding-top: 24px; overflow: hidden">
  <header style="padding: 10px 18px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #EDF2EE">
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3F6B4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
      <span style="font-size: 25px; font-weight: 800; letter-spacing: -1px">Plant<span style="display: inline-block; margin-left: 2px; padding: 0 7px; border-radius: 9px; background: #3F6B4A; color: #FFFFFF">Aí</span></span>
    </span>
  </header>

  <main style="flex: 1; padding: 20px 18px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; gap: 14px; align-items: center">
      <div style="width: 64px; height: 64px; border-radius: 999px; background: #C9DECD; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800">M</div>
      <div style="display: flex; flex-direction: column">
        <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.4px">Marina Souza</h1>
        <span style="font-size: 14px; color: #5B665E">marina@email.com</span>
      </div>
    </div>

    <section style="display: flex; flex-direction: column; border-top: 1px solid #EDF2EE">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #EDF2EE; text-decoration: none; color: inherit">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 13px; font-weight: 600; color: #5B665E">{{r.label}}</span>
            <span style="font-size: 15px; font-weight: 700">{{r.value}}</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B665E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
        </a>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column">
      <a href="M-sobre.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid #EDF2EE; font-size: 15px; font-weight: 700; color: #1F2A22; text-decoration: none">
        Sobre e créditos
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B665E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <a href="M-login.dc.html" style="display: flex; align-items: center; min-height: 52px; font-size: 15px; font-weight: 700; color: #A3361F; text-decoration: none">Sair</a>
    </section>
  </main>

  <nav aria-label="Navegação principal" style="height: 80px; flex-shrink: 0; border-top: 1px solid #EDF2EE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; padding-top: 10px; box-sizing: border-box">
    <a href="M-jardim.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: #5B665E; text-decoration: none; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>
      Jardim
    </a>
    <a href="M-perto.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: #5B665E; text-decoration: none; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Por perto
    </a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; color: #3F6B4A; text-decoration: none; min-height: 44px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
      Perfil
    </a>
    <a href="M-foto.dc.html" aria-label="Identificar uma planta pela foto" style="justify-self: center; width: 52px; height: 52px; border-radius: 16px; background: #3F6B4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -4px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
rows: [
{ label: 'Nome', value: 'Marina Souza' },
{ label: 'WhatsApp', value: '+55 (11) 98765-4321' },
{ label: 'Localização de doação', value: 'Vila Mariana' }
]
};
}
}
</script>
</body>
</html>
